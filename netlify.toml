[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888

[build.environment]
  NODE_VERSION = "20"

# SPA fallback lives in public/_redirects (copied into dist/ at build time)
# instead of here. A netlify.toml [[redirects]] catch-all gets applied
# unconditionally by `netlify dev`'s proxy before it ever reaches Vite,
# swallowing every asset/module request (e.g. /src/main.tsx) and breaking
# the dev server. Netlify's production static file server, by contrast,
# only falls back to _redirects when no real file exists at that path, so
# it's safe there.
